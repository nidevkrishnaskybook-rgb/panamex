<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function(){
  try {
    var saved = localStorage.getItem('panamex-theme-v1');
    if(saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)){
      document.documentElement.setAttribute('data-theme', 'dark');
    }
    var bg = localStorage.getItem('panamex-bg-style-v1') || 'mesh';
    document.documentElement.setAttribute('data-bg', bg);
  } catch(e){}
})();
</script>
<title>Panamex Import Management | Container & Demurrage OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg-app: #F2F5F8;
  --bg-topbar: rgba(242, 245, 248, 0.82);
  --bg-sidebar: rgba(255, 255, 255, 0.90);
  --bg-card: rgba(255, 255, 255, 0.86);
  --bg-subtle: rgba(248, 250, 252, 0.82);
  --bg-input: #EFF2F5;
  --bg-input-field: rgba(255, 255, 255, 0.95);
  --bg-hover: rgba(240, 246, 243, 0.90);
  --bg-accent-light: #EFF5F1;
  --border-card: rgba(226, 232, 240, 0.90);
  --border-subtle: rgba(238, 242, 246, 0.85);
  
  --forest-dark: #123824;
  --forest: #17452D;
  --forest-hover: #1E5437;
  --mint: #40916C;
  --mint-light: #D8F3DC;
  
  --text-main: #111827;
  --text-muted: #6B7280;
  --text-subtle: #9CA3AF;
  
  --amber-bg: #FEF3C7;
  --amber-text: #92400E;
  --rose-bg: #FEE2E2;
  --rose-text: #991B1B;
  --green-bg: #D1FAE5;
  --green-text: #065F46;
  --blue-bg: #E0E7FF;
  --blue-text: #3730A3;
  
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 9999px;
  --shadow-card: 0 4px 20px rgba(18, 56, 36, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
  --shadow-hover: 0 10px 28px rgba(18, 56, 36, 0.08), 0 2px 6px rgba(0, 0, 0, 0.03);

  --gauge-track: #EBF0F3;
  --gauge-hatch: #D8E1E8;

  --pattern-dot: rgba(18, 56, 36, 0.06);
  --ambient-glow-1: rgba(64, 145, 108, 0.12);
  --ambient-glow-2: rgba(2, 132, 199, 0.08);
  --ambient-glow-3: rgba(245, 158, 11, 0.05);
  --card-blur: 14px;
}

[data-theme="dark"], body.dark-theme {
  color-scheme: dark;
  --bg-app: #080C14;
  --bg-topbar: rgba(8, 12, 20, 0.82);
  --bg-sidebar: rgba(13, 19, 33, 0.88);
  --bg-card: rgba(17, 25, 42, 0.84);
  --bg-subtle: rgba(23, 33, 54, 0.80);
  --bg-input: #1B263D;
  --bg-input-field: rgba(16, 24, 40, 0.95);
  --bg-hover: rgba(28, 41, 68, 0.85);
  --bg-accent-light: rgba(16, 185, 129, 0.15);
  --border-card: rgba(36, 50, 80, 0.88);
  --border-subtle: rgba(26, 38, 62, 0.85);
  
  --forest-dark: #10B981;
  --forest: #34D399;
  --forest-hover: #6EE7B7;
  --mint: #34D399;
  --mint-light: rgba(16, 185, 129, 0.2);
  
  --text-main: #F1F5F9;
  --text-muted: #94A3B8;
  --text-subtle: #64748B;
  
  --amber-bg: rgba(245, 158, 11, 0.18);
  --amber-text: #FCD34D;
  --rose-bg: rgba(239, 68, 68, 0.2);
  --rose-text: #FCA5A5;
  --green-bg: rgba(16, 185, 129, 0.18);
  --green-text: #6EE7B7;
  --blue-bg: rgba(59, 130, 246, 0.18);
  --blue-text: #93C5FD;
  
  --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.45);
  --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.65);

  --gauge-track: #1C2740;
  --gauge-hatch: #22304E;

  --pattern-dot: rgba(255, 255, 255, 0.045);
  --ambient-glow-1: rgba(16, 185, 129, 0.14);
  --ambient-glow-2: rgba(59, 130, 246, 0.12);
  --ambient-glow-3: rgba(14, 116, 144, 0.10);
  --card-blur: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: var(--bg-app);
  color: var(--text-main);
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  position: relative;
  min-height: 100vh;
}

/* Background Atmosphere Modes */
html[data-bg="mesh"] body, body[data-bg="mesh"], body:not([data-bg]) {
  background-color: var(--bg-app);
  background-image: 
    radial-gradient(var(--pattern-dot) 1.25px, transparent 1.25px),
    radial-gradient(at 0% 0%, var(--ambient-glow-1) 0px, transparent 55%),
    radial-gradient(at 100% 5%, var(--ambient-glow-2) 0px, transparent 50%),
    radial-gradient(at 50% 100%, var(--ambient-glow-3) 0px, transparent 60%);
  background-size: 26px 26px, 100% 100%, 100% 100%, 100% 100%;
  background-attachment: fixed;
}

html[data-bg="grid"] body, body[data-bg="grid"] {
  background-color: var(--bg-app);
  background-image: 
    linear-gradient(var(--pattern-dot) 1px, transparent 1px),
    linear-gradient(90deg, var(--pattern-dot) 1px, transparent 1px);
  background-size: 28px 28px;
  background-attachment: fixed;
}

html[data-bg="aurora"] body, body[data-bg="aurora"] {
  background-color: var(--bg-app);
  background-image: 
    radial-gradient(at 5% 5%, var(--ambient-glow-1) 0px, transparent 55%),
    radial-gradient(at 95% 10%, var(--ambient-glow-2) 0px, transparent 50%),
    radial-gradient(at 50% 90%, var(--ambient-glow-3) 0px, transparent 65%);
  background-attachment: fixed;
}

html[data-bg="clean"] body, body[data-bg="clean"] {
  background-color: var(--bg-app);
  background-image: none;
}

/* Ambient Glowing Energy Spheres (Floating Background Layer) */
.ambient-bg-orbs {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
  transition: opacity 0.5s ease;
}
html[data-bg="clean"] .ambient-bg-orbs, body[data-bg="clean"] .ambient-bg-orbs {
  opacity: 0;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(85px);
  opacity: 0.85;
  animation: orbDrift 22s infinite alternate ease-in-out;
  will-change: transform;
}
.orb-1 {
  top: -120px;
  left: 18%;
  width: 520px;
  height: 420px;
  background: var(--ambient-glow-1);
  animation-duration: 20s;
}
.orb-2 {
  top: 10%;
  right: 4%;
  width: 480px;
  height: 400px;
  background: var(--ambient-glow-2);
  animation-duration: 26s;
  animation-delay: -6s;
}
.orb-3 {
  bottom: -60px;
  left: 28%;
  width: 560px;
  height: 440px;
  background: var(--ambient-glow-3);
  animation-duration: 24s;
  animation-delay: -12s;
}

@keyframes orbDrift {
  0% { transform: translate3d(0, 0, 0) scale(1); }
  50% { transform: translate3d(35px, 25px, 0) scale(1.08); }
  100% { transform: translate3d(-25px, 40px, 0) scale(0.96); }
}

@media (prefers-reduced-motion: reduce) {
  .orb { animation: none; }
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; background: transparent; }
input, select, textarea { font-family: inherit; font-size: 13px; color: var(--text-main); }
a { color: inherit; text-decoration: none; }

/* Layout Shell */
#app { min-height: 100vh; display: flex; width: 100%; position: relative; z-index: 1; }
.shell { display: flex; width: 100%; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 240px;
  flex: 0 0 240px;
  background: var(--bg-sidebar);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-right: 1px solid var(--border-card);
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  z-index: 40;
  padding: 22px 16px;
  transition: background 0.2s ease, border-color 0.2s ease;
}

.brand-wrapper {
  padding: 4px 6px 20px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
}
.brand-logo-img {
  max-height: 48px;
  width: auto;
  max-width: 100%;
  object-fit: contain;
  display: block;
}

.nav { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.nav-section-title {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-subtle);
  padding: 12px 12px 6px;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  position: relative;
}
.nav-link:hover {
  background: var(--bg-app);
  color: var(--text-main);
}
.nav-link.active {
  color: var(--forest-dark);
  font-weight: 700;
  background: #EFF5F1;
}
.nav-link.active::before {
  content: '';
  position: absolute;
  left: -4px;
  top: 8px;
  bottom: 8px;
  width: 5px;
  border-radius: 4px;
  background: var(--forest-dark);
}
.nav-link .nav-ico {
  font-size: 16px;
  width: 18px;
  text-align: center;
  opacity: 0.85;
}
.nav-link .badge-counter {
  margin-left: auto;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--forest-dark);
  color: #FFFFFF;
}

.sidebar-promo-card {
  margin-top: auto;
  border-radius: var(--radius-lg);
  background: var(--forest-dark) url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,100 C50,150 150,50 200,100 L200,200 L0,200 Z' fill='%23194a30' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat center bottom/cover;
  padding: 16px 14px;
  color: #FFFFFF;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.sidebar-promo-badge {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
}
.sidebar-promo-title { font-size: 12.5px; font-weight: 700; line-height: 1.25; }
.sidebar-promo-sub { font-size: 11px; opacity: 0.75; }

/* Main Content Workspace */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

/* Topbar */
.topbar {
  background: var(--bg-topbar);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  padding: 16px 36px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  position: sticky;
  top: 0;
  z-index: 35;
  border-bottom: 1px solid var(--border-subtle);
  transition: background 0.2s ease, border-color 0.2s ease;
}

.search-pill-box {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-pill);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  width: 320px;
  box-shadow: var(--shadow-card);
  transition: all 0.15s ease;
}
.search-pill-box:focus-within {
  border-color: var(--forest-dark);
  box-shadow: 0 0 0 3px rgba(18, 56, 36, 0.08);
}
.search-pill-box input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 13px;
  width: 100%;
}
.search-pill-box .kbd-tag {
  font-size: 10.5px;
  font-family: 'JetBrains Mono', monospace;
  background: var(--bg-input);
  padding: 2px 6px;
  border-radius: 6px;
  color: var(--text-muted);
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}
.circle-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  color: var(--text-muted);
  box-shadow: var(--shadow-card);
  position: relative;
  transition: all 0.15s ease;
}
.circle-btn:hover { background: var(--bg-hover); color: var(--text-main); }
.circle-btn .badge-dot {
  position: absolute;
  top: 1px;
  right: 1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #EF4444;
  border: 2px solid #FFFFFF;
}

.user-profile-widget {
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 6px;
}
.user-memoji {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #FEEBC8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.user-meta { display: flex; flex-direction: column; }
.user-fullname { font-size: 12.5px; font-weight: 700; color: var(--text-main); line-height: 1.2; }
.user-email-text { font-size: 11px; color: var(--text-muted); }
.btn-switch-user { font-size: 11px; color: var(--forest); cursor: pointer; text-decoration: underline; background: none; border: none; padding: 0; text-align: left; }

/* Content Viewport */
.content {
  padding: 10px 36px 40px;
  flex: 1;
}

/* Page Header Row */
.page-title-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 22px;
}
.page-heading { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; color: var(--text-main); }
.page-subheading { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
.page-actions-group { display: flex; align-items: center; gap: 10px; }

/* Donezo Pill Buttons */
.btn-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: var(--radius-pill);
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.btn-pill-primary {
  background: var(--forest-dark);
  color: #FFFFFF;
  box-shadow: 0 4px 14px rgba(18, 56, 36, 0.2);
}
.btn-pill-primary:hover {
  background: var(--forest-hover);
  transform: translateY(-1px);
  box-shadow: 0 6px 18px rgba(18, 56, 36, 0.28);
}
.btn-pill-secondary {
  background: var(--bg-card);
  color: var(--text-main);
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-card);
}
.btn-pill-secondary:hover {
  background: var(--bg-hover);
  border-color: var(--border-card);
}
.btn-pill-danger {
  background: var(--rose-bg);
  color: var(--rose-text);
  border: 1px solid rgba(220, 38, 38, 0.2);
}
.btn-pill-danger:hover {
  background: #F87171;
  color: #FFFFFF;
}
.btn-pill-sm { padding: 6px 14px; font-size: 12px; }

/* Top 4 Metric KPI Cards (Donezo Style) */
.kpi-row-donezo {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
@media (max-width: 1080px) {
  .kpi-row-donezo { grid-template-columns: repeat(2, 1fr); }
}

.card-kpi {
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  border-radius: var(--radius-lg);
  padding: 22px 22px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 140px;
  box-shadow: var(--shadow-card);
  transition: transform 0.15s ease;
}
.card-kpi:hover { transform: translateY(-2px); }

.card-kpi-hero {
  background: var(--forest-dark) url("data:image/svg+xml,%3Csvg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,120 C100,180 200,60 300,120 L300,200 L0,200 Z' fill='%231a4f33' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat right bottom/cover;
  color: #FFFFFF;
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: 0 8px 24px rgba(18, 56, 36, 0.18);
}
.card-kpi-hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
}
.card-kpi-hero:nth-child(1) {
  background: #123824 url("data:image/svg+xml,%3Csvg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,120 C100,180 200,60 300,120 L300,200 L0,200 Z' fill='%231a4f33' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat right bottom/cover;
}
.card-kpi-hero:nth-child(2) {
  background: #143D27 url("data:image/svg+xml,%3Csvg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,80 C90,160 210,40 300,110 L300,200 L0,200 Z' fill='%231c5437' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat right bottom/cover;
}
.card-kpi-hero:nth-child(3) {
  background: #16422B url("data:image/svg+xml,%3Csvg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,130 C110,60 190,170 300,90 L300,200 L0,200 Z' fill='%231e593a' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat right bottom/cover;
}
.card-kpi-hero:nth-child(4) {
  background: #133926 url("data:image/svg+xml,%3Csvg width='300' height='200' viewBox='0 0 300 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,100 C80,170 220,70 300,140 L300,200 L0,200 Z' fill='%231b5134' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat right bottom/cover;
}
.card-kpi-white {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  color: var(--text-main);
}

.card-kpi-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-kpi-title {
  font-size: 13.5px;
  font-weight: 600;
  opacity: 0.9;
}
.card-kpi-arrow-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.card-kpi-hero .card-kpi-arrow-btn {
  background: #FFFFFF;
  color: var(--forest-dark);
}
.card-kpi-white .card-kpi-arrow-btn {
  background: var(--bg-subtle);
  border: 1px solid var(--border-card);
  color: var(--text-main);
}

.card-kpi-num {
  font-size: 38px;
  font-weight: 800;
  line-height: 1.1;
  margin: 12px 0 8px;
  letter-spacing: -0.03em;
}

.card-kpi-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
}
.card-kpi-hero .card-kpi-pill-badge {
  background: rgba(255, 255, 255, 0.18);
  color: #FFFFFF;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-weight: 600;
  font-size: 11px;
}
.card-kpi-white .card-kpi-pill-badge {
  background: var(--bg-app);
  color: var(--text-muted);
  border: 1px solid var(--border-card);
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  font-weight: 600;
  font-size: 11px;
}

/* Secondary KPI Deck */
.kpi-row-sub {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.kpi-sub-box {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
}
.kpi-sub-num { font-size: 24px; font-weight: 800; color: var(--text-main); line-height: 1.1; }
.kpi-sub-lbl { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-top: 4px; }

/* Panels & Cards */
.panel {
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  margin-bottom: 22px;
  overflow: hidden;
}
.panel-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.panel-title {
  font-size: 15.5px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel-body { padding: 20px 24px; }
.panel-body.flush { padding: 0; }

/* Filters Bar */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-card);
  background: var(--bg-subtle);
}
.filters-bar .field { min-width: 140px; margin-bottom: 0; }
.filters-bar .field.grow { flex: 1; min-width: 220px; }

/* Badges & Status Pills */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: var(--radius-pill);
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
}
.pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.pill-active { background: var(--blue-bg); color: var(--blue-text); }
.pill-soon { background: var(--amber-bg); color: var(--amber-text); }
.pill-over { background: var(--rose-bg); color: var(--rose-text); }
.pill-returned { background: var(--green-bg); color: var(--green-text); }
.pill-pending { background: #F3F4F6; color: var(--text-muted); }
.pill-loc-agent { background: #EDE9FE; color: #6D28D9; }
.pill-loc-panamex { background: #CFFAFE; color: #0E7490; }
.pill-loc-none { background: #F3F4F6; color: var(--text-subtle); }

.mono-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--forest-dark);
  background: #EFF5F1;
  padding: 2px 7px;
  border-radius: 6px;
}

/* Tables */
.table-wrap { overflow-x: auto; width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-card);
  background: var(--bg-subtle);
  white-space: nowrap;
}
thead th.num, td.num { text-align: right; }
thead th.sortable { cursor: pointer; }
thead th.sortable:hover { color: var(--forest-dark); }
tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
  white-space: nowrap;
  color: var(--text-main);
}
tbody tr:hover { background: var(--bg-hover); }

.rowactions { display: flex; gap: 6px; justify-content: flex-end; }
.iconbtn {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border-card);
  background: var(--bg-card);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  color: var(--text-muted);
  transition: all 0.15s ease;
}
.iconbtn:hover { border-color: var(--forest-dark); color: var(--text-main); }

/* Tabs */
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--border-card); margin-bottom: 16px; }
.tab {
  padding: 10px 16px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  cursor: pointer;
}
.tab:hover { color: var(--text-main); }
.tab.active { color: var(--forest-dark); border-bottom-color: var(--forest-dark); }

/* Banners */
.banner { padding: 12px 16px; border-radius: var(--radius-md); font-size: 12.5px; margin-bottom: 16px; border: 1px solid; }
.banner-info { background: #EFF6FF; border-color: #BFDBFE; color: #1E40AF; }
.banner-warn { background: var(--amber-bg); border-color: #FDE68A; color: var(--amber-text); }
.banner-danger { background: var(--rose-bg); border-color: #FECACA; color: var(--rose-text); }

/* Modals */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(18, 56, 36, 0.4);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 16px;
  overflow-y: auto;
  z-index: 100;
}
.modal {
  background: var(--bg-card);
  width: 100%;
  max-width: 680px;
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px rgba(18, 56, 36, 0.12);
  overflow: hidden;
  border: 1px solid var(--border-card);
}
.modal-head {
  padding: 18px 24px;
  border-bottom: 1px solid var(--border-card);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-head h3 { font-size: 16.5px; font-weight: 800; color: var(--text-main); }
.modal-body { padding: 24px; max-height: 72vh; overflow-y: auto; }
.modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--border-card);
  background: var(--bg-subtle);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.formsection {
  font-size: 11.5px;
  font-weight: 800;
  color: var(--forest-dark);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 18px 0 10px;
  padding-top: 14px;
  border-top: 1px solid var(--border-subtle);
}
.formsection:first-child { margin-top: 0; padding-top: 0; border-top: none; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 11.5px; font-weight: 700; color: var(--text-muted); }
.field .hint { font-size: 10.5px; color: var(--text-subtle); }
input[type=text], input[type=date], input[type=number], input[type=email], select, textarea {
  padding: 9px 12px;
  border: 1px solid var(--border-card);
  border-radius: 10px;
  background: var(--bg-input-field);
  color: var(--text-main);
  outline: none;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--forest-dark);
  box-shadow: 0 0 0 3px rgba(18, 56, 36, 0.08);
}
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
@media (max-width: 640px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.checkline { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-main); cursor: pointer; }

/* Login */
.login-wrap {
  min-height: 100vh;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg-app);
  padding: 24px;
  position: relative;
}
.login-card {
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  width: 100%;
  max-width: 440px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-card);
}
.userlist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
.userlist button {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border: 1px solid var(--border-card);
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
  text-align: left;
  width: 100%;
  transition: all 0.15s ease;
}
.userlist button:hover { border-color: var(--forest); background: var(--bg-hover); }
.userlist .av {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #FEEBC8;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--forest-dark);
  color: #FFFFFF;
  padding: 12px 20px;
  border-radius: var(--radius-pill);
  font-size: 13px;
  font-weight: 600;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(18, 56, 36, 0.25);
}

/* ============================================================
   ADMIN DASHBOARD: DIAGRAMS, GRAPHS & VISUAL ANALYTICS
   ============================================================ */

/* Interactive Pipeline Workflow Diagram - Connected Logistics Stepper */
.pipeline-card {
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 22px 24px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
  margin-bottom: 22px;
  position: relative;
  overflow: visible;
}
.pipeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 10px;
}
.pipeline-flow-badge-icon {
  width: 36px;
  height: 36px;
  border-radius: 12px;
  background: #EFF5F1;
  color: var(--forest-dark);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.pipeline-title {
  font-size: 15.5px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.01em;
}
.pipeline-subtitle {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 1px;
}
.pipeline-active-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: #047857;
  background: #ECFDF5;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
}
.pipeline-pulsing-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.3);
  animation: beaconPulse 2s infinite ease-in-out;
}
.pipeline-fleet-pill {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--forest-dark);
  background: #EFF5F1;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
}

.pipeline-flow-wrap {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 16px;
  position: relative;
}
@media (max-width: 1100px) {
  .pipeline-flow-wrap { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
}

.pipeline-step {
  border: 1px solid var(--border-card);
  border-radius: 16px;
  padding: 16px 16px 14px;
  position: relative;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 130px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
}
.pipeline-step:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
}
.pipeline-step-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.pipeline-step-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
}
.pipeline-step-badge {
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.pipeline-step-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  color: var(--text-main);
  margin-bottom: 6px;
  letter-spacing: -0.03em;
}
.pipeline-step-title {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pipeline-step-sub {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.pipeline-step-tag-pill {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 6px;
  margin-top: 8px;
  width: fit-content;
}
.pipeline-step-bar {
  height: 4px;
  border-radius: 2px;
  background: var(--bg-app);
  margin-top: 10px;
  overflow: hidden;
}
.pipeline-step-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* Floating forward arrow connector between cards */
.pipeline-step-connector {
  position: absolute;
  right: -14px;
  top: 50%;
  transform: translateY(-50%);
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: var(--bg-card);
  border: 1.5px solid var(--border-card);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--forest);
  font-weight: 800;
  z-index: 10;
  pointer-events: none;
}
@media (max-width: 1100px) {
  .pipeline-step-connector { display: none; }
}

/* Charts Grid Systems */
.charts-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 22px;
}
@media (max-width: 1180px) {
  .charts-grid-3 { grid-template-columns: 1fr; }
}

.charts-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 22px;
}
@media (max-width: 980px) {
  .charts-grid-2 { grid-template-columns: 1fr; }
}

/* Individual Visual Card */
.visual-card {
  backdrop-filter: blur(var(--card-blur));
  -webkit-backdrop-filter: blur(var(--card-blur));
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--radius-lg);
  padding: 22px;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 280px;
}
.visual-card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 14px;
}
.visual-card-title {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.visual-card-sub {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Horseshoe Gauge Layout */
.gauge-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 0;
}
.gauge-svg-box {
  position: relative;
  width: 200px;
  height: 135px;
}
.gauge-center-text {
  position: absolute;
  top: 60%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.gauge-pct-num {
  font-size: 34px;
  font-weight: 800;
  color: var(--forest-dark);
  line-height: 1;
  letter-spacing: -0.03em;
}
.gauge-pct-lbl {
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 4px;
}
.gauge-legend-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.gauge-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}
.gauge-legend-item:hover { background: var(--bg-app); }
.legend-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

/* Capsule Bar Chart Layout */
.capsule-chart-wrap {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  height: 155px;
  padding: 10px 4px 4px;
}
.capsule-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex: 1;
  height: 100%;
  justify-content: flex-end;
}
.capsule-badge {
  font-size: 10px;
  font-weight: 800;
  background: var(--bg-app);
  border: 1px solid var(--border-card);
  padding: 1px 6px;
  border-radius: var(--radius-pill);
  color: var(--text-muted);
  white-space: nowrap;
}
.capsule-bar-track {
  width: 100%;
  max-width: 32px;
  height: 100px;
  background: var(--bg-app);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;
  position: relative;
}
.capsule-bar-fill {
  width: 100%;
  border-radius: 16px;
  background: linear-gradient(180deg, var(--mint) 0%, var(--forest-dark) 100%);
  transition: height 0.3s ease;
}
.capsule-bar-fill.secondary {
  background: linear-gradient(180deg, #93C5FD 0%, #3B82F6 100%);
}
.capsule-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
}

/* Real-Time Operations Tracker & Yard Space */
.ops-clock-box {
  background: #EFF5F1;
  border: 1px solid #D1E7D9;
  border-radius: var(--radius-md);
  padding: 12px 16px;
  margin-bottom: 12px;
}
.ops-clock-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.ops-beacon {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--forest-dark);
}
.beacon-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10B981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  animation: beaconPulse 2s infinite ease-in-out;
}
@keyframes beaconPulse {
  0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
  70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
.ops-digital-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 24px;
  font-weight: 800;
  color: var(--forest-dark);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.ops-timezone-text {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 2px;
}

.yard-progress-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.yard-progress-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.yard-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
}
.yard-item-title { font-weight: 700; color: var(--text-main); }
.yard-item-meta { font-size: 11px; color: var(--text-muted); font-weight: 600; }
.yard-bar-bg {
  height: 8px;
  background: var(--bg-app);
  border-radius: 4px;
  overflow: hidden;
}
.yard-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--forest);
}

/* Shipping Line Performance Matrix */
.carrier-matrix-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.carrier-row {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: var(--radius-sm);
  transition: background 0.15s;
}
.carrier-row:hover { background: var(--bg-hover); }
.carrier-badge-box {
  width: 100px;
  flex-shrink: 0;
}
.carrier-name {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.carrier-free-days {
  font-size: 10px;
  color: var(--text-muted);
}
.carrier-stacked-bar-wrap {
  flex: 1;
  height: 10px;
  background: var(--bg-app);
  border-radius: var(--radius-pill);
  display: flex;
  overflow: hidden;
}
.carrier-segment {
  height: 100%;
  transition: width 0.3s ease;
}
.carrier-stat-pill {
  font-size: 11px;
  font-weight: 700;
  min-width: 60px;
  text-align: right;
  color: var(--text-main);
}

/* Formalities Funnel Checklist */
.formalities-grid {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.formality-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.formality-row:last-child { border-bottom: none; }
.formality-num-badge {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #EFF5F1;
  color: var(--forest-dark);
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.formality-info {
  flex: 1;
  min-width: 0;
}
.formality-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.formality-bar-bg {
  height: 6px;
  background: var(--bg-app);
  border-radius: 3px;
  margin-top: 4px;
  overflow: hidden;
}
.formality-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--forest-dark);
}

@media (max-width: 860px) {
  .sidebar { display: none; }
  .topbar { padding: 16px 20px; }
  .content { padding: 10px 20px 40px; }
}

/* ============================================================
   THEME TOGGLE SWITCH & DARK THEME OVERRIDES
   ============================================================ */
.theme-switch-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  height: 38px;
  border-radius: var(--radius-pill);
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  box-shadow: var(--shadow-card);
  cursor: pointer;
  color: var(--text-main);
  font-size: 12px;
  font-weight: 700;
  transition: all 0.18s ease;
  user-select: none;
}
.theme-switch-btn:hover {
  background: var(--bg-hover);
  border-color: var(--forest);
  transform: translateY(-1px);
  box-shadow: var(--shadow-hover);
}
.theme-switch-track {
  width: 38px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: var(--bg-input);
  border: 1px solid var(--border-card);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  box-sizing: border-box;
}
.theme-switch-icon {
  font-size: 9.5px;
  line-height: 1;
  z-index: 1;
  pointer-events: none;
}
.theme-switch-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: #FFFFFF;
  box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
}
[data-theme="dark"] .theme-switch-track {
  background: #0B1220;
  border-color: #2D3D5E;
}
[data-theme="dark"] .theme-switch-thumb {
  transform: translateX(18px);
  background: #10B981;
  box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
}
.theme-switch-label {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.01em;
}
@media (max-width: 640px) {
  .theme-switch-label { display: none; }
  .theme-switch-btn { padding: 6px 8px; }
}

.login-theme-box {
  position: absolute;
  top: 24px;
  right: 28px;
  z-index: 50;
}

/* Dark Theme Specific Overrides */
[data-theme="dark"] .brand-logo-img {
  background: #FFFFFF;
  padding: 5px 9px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
[data-theme="dark"] .login-card img {
  background: #FFFFFF;
  padding: 7px 14px;
  border-radius: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}
[data-theme="dark"] .nav-link.active {
  color: #34D399;
  background: rgba(16, 185, 129, 0.14);
}
[data-theme="dark"] .nav-link.active::before {
  background: #34D399;
}
[data-theme="dark"] .sidebar-promo-card {
  background: #0E2219 url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,100 C50,150 150,50 200,100 L200,200 L0,200 Z' fill='%23194a30' fill-opacity='0.5'/%3E%3C/svg%3E") no-repeat center bottom/cover;
  border: 1px solid rgba(52, 211, 153, 0.25);
}
[data-theme="dark"] .btn-pill-primary {
  background: #10B981;
  color: #032313;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
}
[data-theme="dark"] .btn-pill-primary:hover {
  background: #34D399;
  color: #032313;
  box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
}
[data-theme="dark"] .card-kpi-hero {
  border: 1px solid rgba(52, 211, 153, 0.2);
}
[data-theme="dark"] .card-kpi-hero .card-kpi-arrow-btn {
  background: rgba(255, 255, 255, 0.15);
  color: #FFFFFF;
}
[data-theme="dark"] .pipeline-step {
  background: linear-gradient(180deg, #18233A 0%, #131C2E 100%) !important;
  border-color: var(--border-card) !important;
}
[data-theme="dark"] .pipeline-step-connector {
  background: #131C2E !important;
  border-color: var(--border-card) !important;
  color: #34D399 !important;
}
[data-theme="dark"] .pipeline-step-icon,
[data-theme="dark"] .pipeline-step-badge,
[data-theme="dark"] .pipeline-step-tag-pill {
  background: rgba(255, 255, 255, 0.08) !important;
}
[data-theme="dark"] .ops-clock-box {
  background: #0D1826;
  border-color: #1E344F;
}
[data-theme="dark"] .ops-digital-time,
[data-theme="dark"] .ops-beacon {
  color: #34D399;
}
[data-theme="dark"] .formality-num-badge {
  background: var(--bg-subtle);
  color: #34D399;
}
[data-theme="dark"] .pipeline-flow-badge-icon,
[data-theme="dark"] .pipeline-fleet-pill {
  background: var(--bg-subtle);
  color: #34D399;
}
[data-theme="dark"] .mono-tag {
  background: rgba(16, 185, 129, 0.14);
  color: #34D399;
}
[data-theme="dark"] .mono-tag[style*="#E0E7FF"] {
  background: rgba(59, 130, 246, 0.2) !important;
  color: #93C5FD !important;
}
[data-theme="dark"] .mono-tag[style*="#F3F4F6"] {
  background: var(--bg-subtle) !important;
  color: var(--text-muted) !important;
}
[data-theme="dark"] .toast {
  background: #10B981;
  color: #032313;
  box-shadow: 0 8px 24px rgba(16, 185, 129, 0.4);
}
[data-theme="dark"] .overlay {
  background: rgba(0, 0, 0, 0.72);
}
[data-theme="dark"] .tab.active {
  color: #34D399;
  border-bottom-color: #34D399;
}
[data-theme="dark"] .btn-switch-user {
  color: #34D399;
}
[data-theme="dark"] .formsection {
  color: #34D399;
  border-top-color: var(--border-card);
}
[data-theme="dark"] .user-memoji,
[data-theme="dark"] .userlist .av {
  background: #252019;
  border: 1px solid #433726;
}
[data-theme="dark"] .circle-btn .badge-dot {
  border-color: var(--bg-card);
}
[data-theme="dark"] .gauge-pct-num {
  color: #34D399;
}

</style>

}

function getInitialTheme(){
  try {
    var saved = localStorage.getItem(THEME_KEY);
    if(saved === 'dark' || saved === 'light') return saved;
  } catch(e){}
  if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    return 'dark';
  }
  return 'light';
}

function applyTheme(t){
  if(t === 'dark'){
    document.documentElement.setAttribute('data-theme', 'dark');
    if(document.body) document.body.classList.add('dark-theme');
  } else {
    document.documentElement.removeAttribute('data-theme');
    if(document.body) document.body.classList.remove('dark-theme');
  }
}

var memStore = {};
function storageGet(key){
  try {
    if(window.localStorage){
      var v = window.localStorage.getItem(key);
      if(v !== null) return Promise.resolve(JSON.parse(v));
    }
  } catch(e){}
  return Promise.resolve(memStore[key] ? JSON.parse(memStore[key]) : null);
}
function storageSet(key, value){
  var json = JSON.stringify(value);
  memStore[key] = json;
  try {
    if(window.localStorage) window.localStorage.setItem(key, json);
  } catch(e){}
  return Promise.resolve(true);
}

/* ============================================================
   DOMAIN LOGIC: DUE DATES, PORTS & STAGES
   ============================================================ */
function uid(p){ return p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  if(!dateStr) return null;
  var d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+Number(days||0));
  return d.toISOString().slice(0,10);
}
function diffDays(dateStr, fromStr){
  if(!dateStr) return 0;
  var a = new Date(dateStr+'T00:00:00');
  var b = new Date((fromStr||todayStr())+'T00:00:00');
  return Math.round((a-b)/86400000);
}
function fmtDate(s){
  if(!s) return '—';
  var d = new Date(s+'T00:00:00');
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}
function escapeHtml(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
function initials(name){
  if(!name) return '?';
  var p = name.trim().split(/\s+/);
  return (p[0][0]+(p[1]?p[1][0]:'')).toUpperCase();
}
function showToast(msg){
  state.toast = msg;
  renderToastOnly();
  setTimeout(function(){ state.toast=null; renderToastOnly(); }, 2600);
}
function renderToastOnly(){
  var el = document.getElementById('toastHolder');
  if(el) el.innerHTML = state.toast ? '<div class="toast">'+escapeHtml(state.toast)+'</div>' : '';
}

function basisDateFor(c){
  if(c.eta) return {date:c.eta, basis:'ETA'};
  if(c.clearanceDate) return {date:c.clearanceDate, basis:'Clearance Date (fallback)'};
  return {date:null, basis:null};
}
function computeDueDate(c){
  var b = basisDateFor(c);
  if(!b.date || c.freeDays===''||c.freeDays===undefined||c.freeDays===null) return null;
  return addDays(b.date, c.freeDays);
}
function computeStatus(c){
  if(c.emptyReturnDate) return STATUS.RETURNED;
  if(!c.clearanceDate) return STATUS.PENDING;
  var due = c.dueDate || computeDueDate(c);
  if(!due) return STATUS.ACTIVE;
  var d = diffDays(due, todayStr());
  if(d < 0) return STATUS.OVER;
  if(d <= Number(state.settings.alertDays||3)) return STATUS.SOON;
  return STATUS.ACTIVE;
}
function effectiveStatus(c){
  return c.statusLocked ? c.status : computeStatus(c);
}
function locationLabel(c){
  if(c.emptyReturnDate) return '—';
  if(!c.clearanceDate) return '—';
  return c.location || 'Not yet allocated';
}
function daysHeld(c){
  var start = c.clearanceDate || c.eta;
  if(!start) return null;
  var end = c.emptyReturnDate || todayStr();
  return diffDays(end, start);
}

function computePortDueDate(c){
  if(!c.fullDischargeDate) return null;
  var pfd = (c.portFreeDays===''||c.portFreeDays===undefined||c.portFreeDays===null) ? state.settings.portFreeDays : c.portFreeDays;
  return addDays(c.fullDischargeDate, pfd);
}
function computePortStatus(c){
  var due = computePortDueDate(c);
  if(!due) return PORT_STATUS.AWAITING;
  if(c.clearanceDate){
    return diffDays(c.clearanceDate, due) > 0 ? PORT_STATUS.CLEARED_LATE : PORT_STATUS.CLEARED_OK;
  }
  var d = diffDays(due, todayStr());
  if(d < 0) return PORT_STATUS.OVER;
  if(d <= Number(state.settings.alertDays||3)) return PORT_STATUS.SOON;
  return PORT_STATUS.WITHIN;
}
function computeStage(c){
  if(c.emptyReturnDate) return STAGE.RETURNED;
  if(c.clearanceDate) return STAGE.CONTROL;
  return STAGE.SHIPPING;
}

function pillClass(status){
  switch(status){
    case STATUS.OVER: return 'pill-over';
    case STATUS.SOON: return 'pill-soon';
    case STATUS.RETURNED: return 'pill-returned';
    case STATUS.PENDING: return 'pill-pending';
    default: return 'pill-active';
  }
}
function locationPillClass(loc){
  if(loc===LOCATIONS.AGENT) return 'pill-loc-agent';
  if(loc===LOCATIONS.PANAMEX) return 'pill-loc-panamex';
  return 'pill-loc-none';
}
function stagePillClass(stage){
  if(stage===STAGE.RETURNED) return 'pill-returned';
  if(stage===STAGE.CONTROL) return 'pill-active';
  return 'pill-loc-agent';
}
function portPillClass(ps){
  switch(ps){
    case PORT_STATUS.OVER: case PORT_STATUS.CLEARED_LATE: return 'pill-over';
    case PORT_STATUS.SOON: return 'pill-soon';
    case PORT_STATUS.CLEARED_OK: return 'pill-returned';
    case PORT_STATUS.AWAITING: return 'pill-pending';
    default: return 'pill-active';
  }
}

}

function pushAudit(entry){

function diffContainer(before, after){
  var out = [];
  var keys = Object.keys(CONTAINER_FIELD_LABELS);
  keys.forEach(function(k){
    var a = before ? before[k] : undefined;
    var b = after[k];
    if((a||'')!==(b||'')){
      out.push({field:CONTAINER_FIELD_LABELS[k], from:(a===undefined||a==='')?'—':String(a), to:(b===undefined||b==='')?'—':String(b)});
    }
  });
  return out;
}

function saveContainer(data, isNew){
  var before = null;
  if(!isNew){
    before = state.containers.filter(function(c){return c.id===data.id;})[0];
  }
  data.dueDate = computeDueDate(data);
  if(!data.statusLocked) data.status = computeStatus(data);
  data.updatedAt = new Date().toISOString();
  data.updatedBy = state.currentUser ? state.currentUser.name : 'Staff';

  if(isNew){
    data.id = uid('cnt');
    data.createdAt = data.updatedAt;
    data.createdBy = data.updatedBy;
    state.containers.unshift(data);
    pushAudit({action:'create', containerId:data.id, containerNo:data.containerNo, changes:diffContainer(null, data)});
    showToast('Container '+(data.containerNo||data.jobNo)+' registered.');
  } else {
    state.containers = state.containers.map(function(c){ return c.id===data.id ? data : c; });
    var changes = diffContainer(before, data);
    if(changes.length){
      pushAudit({action:'update', containerId:data.id, containerNo:data.containerNo, changes:changes});
    }
    showToast('Container '+(data.containerNo||data.jobNo)+' updated.');
  }
  storageSet(CONTAINERS_KEY, state.containers);
  state.modal = null;
  checkAndLogAlertEmails();
  render();
}

function deleteContainer(id){
  var c = state.containers.filter(function(x){return x.id===id;})[0];
  state.containers = state.containers.filter(function(x){return x.id!==id;});
  storageSet(CONTAINERS_KEY, state.containers);
  pushAudit({action:'delete', containerId:id, containerNo:c?c.containerNo:'', changes:[]});
  showToast('Container deleted.');
  state.modal = null;
  render();
}

function saveUser(data, isNew){
  data.updatedAt = new Date().toISOString();
  if(isNew){
    data.id = uid('usr');
    data.createdAt = data.updatedAt;
    state.users.push(data);
    pushAudit({action:'user-add', containerId:'', containerNo:'', changes:[{field:'User', from:'—', to:data.name+' ('+data.role+')'}]});
    showToast('User '+data.name+' added.');
  } else {
    var before = state.users.filter(function(u){return u.id===data.id;})[0];
    state.users = state.users.map(function(u){ return u.id===data.id ? data : u; });
    var changes = [];
    if(before && before.role!==data.role) changes.push({field:'Role', from:before.role, to:data.role});
    pushAudit({action:'user-update', containerId:'', containerNo:'', changes:changes});
    showToast('User '+data.name+' updated.');
  }
  storageSet(USERS_KEY, state.users);
  state.modal = null;
  render();
}

   ============================================================ */
function computeAlerts(){
  var soon=[], over=[];
  state.containers.forEach(function(c){
    var s = effectiveStatus(c);
    if(s===STATUS.SOON) soon.push(c);
    if(s===STATUS.OVER) over.push(c);
  });
  soon.sort(function(a,b){ return (a.dueDate||'').localeCompare(b.dueDate||''); });
  over.sort(function(a,b){ return (a.dueDate||'').localeCompare(b.dueDate||''); });
  return {soon:soon, over:over};
}

function computePortAlerts(){
  var soon=[], over=[];
  state.containers.forEach(function(c){
    if(c.clearanceDate) return;
    var ps = computePortStatus(c);
    if(ps===PORT_STATUS.SOON) soon.push(c);
    if(ps===PORT_STATUS.OVER) over.push(c);
  });
  return {soon:soon, over:over};
}

function checkAndLogAlertEmails(){
  var alerts = computeAlerts();
  var portAlerts = computePortAlerts();
  var toLog = alerts.soon.concat(alerts.over);
  var existing = {};
  state.emailLog.forEach(function(e){ existing[e.containerId+'|'+e.kind+'|'+e.dateKey] = true; });

  toLog.forEach(function(c){
    var kind = effectiveStatus(c)===STATUS.OVER ? 'overdue' : 'due-soon';
    var key = c.id+'|'+kind+'|'+todayStr();
    if(!existing[key]){
      state.emailLog.unshift({
        id:uid('mail'), containerId:c.id, containerNo:c.containerNo, jobNo:c.jobNo, kind:kind,
        dateKey:todayStr(), createdAt:new Date().toISOString(),
        subject: (kind==='overdue' ? 'OVERDUE: ' : 'Due Soon: ')+'Container '+(c.containerNo||c.jobNo)+' — action required',
        sent:false
      });
    }
  });
  storageSet(EMAILLOG_KEY, state.emailLog);
}

function filteredContainers(){
  var f = state.filters;
  var q = f.q.trim().toLowerCase();
  var list = state.containers.filter(function(c){
    if(f.status && effectiveStatus(c)!==f.status) return false;
    if(f.line && c.shippingLine!==f.line) return false;
    if(f.location && locationLabel(c)!==f.location) return false;
    if(f.stage && computeStage(c)!==f.stage) return false;
    if(f.overdueOnly && effectiveStatus(c)!==STATUS.OVER) return false;
    if(q){
      var hay = [c.jobNo,c.billNo,c.containerNo,c.shippingLine,c.productDescription,c.pplNo,c.vesselName,c.voyageNo].join(' ').toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  });
  var key = state.sort.key, dir = state.sort.dir==='asc'?1:-1;
  list.sort(function(a,b){
    var av = a[key]||'', bv = b[key]||'';
    if(key==='freeDays'){ av=Number(av||0); bv=Number(bv||0); return (av-bv)*dir; }
    return String(av).localeCompare(String(bv))*dir;
  });
  return list;
}

function uniqueShippingLines(){
  var set = {};
  state.containers.forEach(function(c){ if(c.shippingLine) set[c.shippingLine]=true; });
  return Object.keys(set).sort();
}

function loadExternalScript(url){
  return new Promise(function(resolve, reject){
    var s = document.createElement('script');
    s.src = url;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}
function ensureXLSX(){
  if(window.XLSX) return Promise.resolve();
  return loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
}
function ensurePDF(){
  var ready = function(){ return window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && typeof window.jspdf.jsPDF.API.autoTable === 'function'; };
  if(ready()) return Promise.resolve();
  var p = window.jspdf ? Promise.resolve() : loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
  return p.then(function(){
    if(ready()) return;
    return loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js');
  });
}

function reportRowsForExport(rows){

      'PPL #':c.pplNo||'', 'Vessel Name':c.vesselName||'', 'Voyage No.':c.voyageNo||'',
      'Shipping Line':c.shippingLine||'', 'Stage':computeStage(c),

function renderContentOnly(){

function renderContent(){
  switch(state.view){
    case 'dashboard': return renderDashboard();
    case 'containers': return renderContainers();

    case 'audit': return can('auditView') ? renderAudit() : renderNoAccess();

function renderComplianceGaugeCard(alerts){
  var total = state.containers.length || 1;
  var overCount = alerts.over.length;
  var soonCount = alerts.soon.length;
  var compliantCount = Math.max(0, total - overCount);
  var compliantPct = Math.round((compliantCount / total) * 100);

  var arcLen = 306.3;
  var safeRatio = Math.max(0, (total - overCount - soonCount) / total);
  var safeOffset = (arcLen * (1 - safeRatio)).toFixed(1);

  var svg = '<svg viewBox="0 0 200 145" width="100%" height="100%" style="overflow:visible;">'+
    '<defs>'+
      '<pattern id="gaugeHatchPattern" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">'+
        '<line x1="0" y1="0" x2="0" y2="6" stroke="var(--gauge-hatch)" stroke-width="2.5" />'+
      '</pattern>'+
    '</defs>'+
    '<path d="M 54.0 131.0 A 65 65 0 1 1 146.0 131.0" fill="none" stroke="url(#gaugeHatchPattern)" stroke-width="13" stroke-linecap="round" />'+
    '<path d="M 54.0 131.0 A 65 65 0 1 1 146.0 131.0" fill="none" stroke="var(--gauge-track)" stroke-width="13" stroke-linecap="round" />'+
    '<path d="M 54.0 131.0 A 65 65 0 1 1 146.0 131.0" fill="none" stroke="var(--forest-dark)" stroke-width="13" stroke-linecap="round" '+
      'stroke-dasharray="'+arcLen+'" stroke-dashoffset="'+safeOffset+'" style="transition: stroke-dashoffset 0.8s ease;" />'+
  '</svg>';

  return '<div class="visual-card">'+
    '<div class="visual-card-head">'+
      '<div>'+
        '<div class="visual-card-title">🎯 Free-Time Compliance</div>'+
        '<div class="visual-card-sub">Demurrage penalty avoidance efficiency</div>'+
      '</div>'+
      '<div style="font-size:11px;font-weight:700;color:var(--forest);background:#EFF5F1;padding:3px 8px;border-radius:var(--radius-pill);">Live Gauge</div>'+
    '</div>'+
    '<div class="gauge-wrap">'+
      '<div class="gauge-svg-box">'+
        svg+
        '<div class="gauge-center-text">'+
          '<div class="gauge-pct-num">'+compliantPct+'%</div>'+
          '<div class="gauge-pct-lbl">Compliant</div>'+
        '</div>'+
      '</div>'+
      '<div class="gauge-legend-row">'+
        '<div class="gauge-legend-item" data-act="filter-status" data-id="'+STATUS.ACTIVE+'" title="Click to view safe containers">'+
          '<span class="legend-dot" style="background:var(--forest-dark);"></span> Safe: '+(total - overCount - soonCount)+
        '</div>'+
        '<div class="gauge-legend-item" data-act="filter-status" data-id="'+STATUS.SOON+'" title="Click to view warning containers">'+
          '<span class="legend-dot" style="background:var(--amber-text);"></span> Warning: '+soonCount+
        '</div>'+
        '<div class="gauge-legend-item" data-act="filter-status" data-id="'+STATUS.OVER+'" title="Click to view overdue containers">'+
          '<span class="legend-dot" style="background:var(--rose-text);"></span> Overdue: '+overCount+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

    { num:'2', title:'NAQIA PTL (Pass To Load) Clearance', done: active.filter(function(c){ return !!c.naqiaPtlDate; }).length, icon:'🌱' },
    { num:'3', title:'Wharfage & Handling (W&H) Paid', done: active.filter(function(c){ return !!c.whChargesPaidDate; }).length, icon:'💳' },
    { num:'4', title:'Shipping Delivery Order (DO) Issued', done: active.filter(function(c){ return !!c.doIssueDate; }).length, icon:'📜' },
    { num:'5', title:'PNG Ports Gate Pass (GP) Issued', done: active.filter(function(c){ return !!c.gpIssueDate; }).length, icon:'🚧' },
    { num:'6', title:'Gate Out & Cleared to Yard (1B / 6A)', done: active.filter(function(c){ return !!c.clearanceDate; }).length, icon:'🚚' }
  ];

  var html = '<div class="visual-card" style="min-height:auto;">'+
    '<div class="visual-card-head">'+
      '<div>'+
        '<div class="visual-card-title">📋 Pre-Clearance Bottleneck Funnel</div>'+
        '<div class="visual-card-sub">Logistics milestones completion status for '+active.length+' active manifests</div>'+
      '</div>'+
      '<div style="font-size:11px;font-weight:700;color:var(--forest);background:#EFF5F1;padding:3px 8px;border-radius:var(--radius-pill);">Formalities Tracker</div>'+
    '</div>'+
    '<div class="formalities-grid">';

  items.forEach(function(it){
    var pct = Math.round((it.done / total) * 100);
    var pending = total - it.done;
    var statusText = pending === 0 ? '<span style="color:#10B981;">✓ 100% Cleared</span>' : '<span style="color:var(--amber-text);">'+pending+' Pending</span>';

    html += '<div class="formality-row">'+
      '<div class="formality-num-badge">'+it.num+'</div>'+
      '<div class="formality-info">'+
        '<div class="formality-title">'+
          '<span>'+it.title+'</span>'+

        '<div class="formality-bar-bg">'+
          '<div class="formality-bar-fill" style="width:'+pct+'%;background:'+(pct===100?'#10B981':'var(--forest-dark)')+';"></div>'+
        '</div>'+
      '</div>'+
    '</div>';
  });

  html += '</div></div>';
  return html;
}

function containerMiniTable(list, emptyMsg){
  if(!list.length) return '<div style="padding:26px;color:var(--text-muted);text-align:center;font-size:13px;">'+emptyMsg+'</div>';
  var rows = list.map(function(c){
    var s = effectiveStatus(c);
    var loc = locationLabel(c);
    return '<tr>'+
      '<td><span class="mono-tag">'+escapeHtml(c.jobNo)+'</span></td>'+
      '<td><span class="mono-tag" style="background:#E0E7FF;color:#3730A3;">'+escapeHtml(c.containerNo)+'</span></td>'+
      '<td>'+escapeHtml(c.shippingLine||'—')+'</td>'+
      '<td>'+fmtDate(c.dueDate||computeDueDate(c))+'</td>'+
      '<td><span class="pill '+pillClass(s)+'">'+s+'</span></td>'+
      '<td>'+(loc==='—'?'<span style="color:var(--text-subtle);">—</span>':'<span class="pill '+locationPillClass(loc)+'">'+escapeHtml(loc)+'</span>')+'</td>'+
      '<td class="rowactions"><button class="iconbtn" data-act="edit-container" data-id="'+c.id+'" title="Edit">✏️</button></td>'+
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Job No.</th><th>Container No.</th><th>Line</th><th>Due Date</th><th>Status</th><th>Location</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function portMiniTable(list, emptyMsg){
  if(!list.length) return '<div style="padding:26px;color:var(--text-muted);text-align:center;font-size:13px;">'+emptyMsg+'</div>';
  var rows = list.map(function(c){
    var ps = computePortStatus(c);
    return '<tr>'+
      '<td><span class="mono-tag">'+escapeHtml(c.jobNo)+'</span></td>'+
      '<td><span class="mono-tag" style="background:#E0E7FF;color:#3730A3;">'+escapeHtml(c.containerNo)+'</span></td>'+
      '<td>'+escapeHtml(c.shippingLine||'—')+'</td>'+
      '<td>'+fmtDate(c.fullDischargeDate)+'</td>'+
      '<td>'+fmtDate(computePortDueDate(c))+'</td>'+
      '<td><span class="pill '+portPillClass(ps)+'">'+ps+'</span></td>'+
      '<td class="rowactions"><button class="iconbtn" data-act="edit-container" data-id="'+c.id+'" title="Edit">✏️</button></td>'+

  return '<div class="table-wrap"><table><thead><tr><th>Job No.</th><th>Container No.</th><th>Line</th><th>Full Discharge</th><th>Port Due</th><th>Port Status</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

  '</div>';

  html += '<div class="panel">'+
    '<div class="panel-head"><div class="panel-title" style="color:var(--amber-text);">⏳ Port Free Days Ending Soon — '+portAlerts.soon.length+'</div></div>'+
    '<div class="panel-body flush">'+portMiniTable(portAlerts.soon, 'Nothing close to running out of Port Free Days.')+'</div>'+
  '</div>';

  html += '<div class="panel">'+
    '<div class="panel-head"><div class="panel-title" style="color:var(--rose-text);">🚨 Container Return Overdue — '+alerts.over.length+'</div></div>'+
    '<div class="panel-body flush">'+containerMiniTable(alerts.over, 'No overdue containers. Great job.')+'</div>'+
  '</div>';

  html += '<div class="panel">'+
    '<div class="panel-head"><div class="panel-title" style="color:var(--amber-text);">⏳ Container Return Due Soon (Within '+state.settings.alertDays+' Days) — '+alerts.soon.length+'</div></div>'+
    '<div class="panel-body flush">'+containerMiniTable(alerts.soon, 'Nothing due soon.')+'</div>'+
  '</div>';

  html += '<div class="panel">'+
    '<div class="panel-head"><div class="panel-title">Email Alert Notification Queue</div></div>'+
    '<div class="panel-body flush">';

  var log = state.emailLog.slice(0, 30);
  if(!log.length){
    html += '<div style="padding:28px;text-align:center;color:var(--text-muted);">No alert emails generated yet.</div>';
  } else {
    var rows = log.map(function(e){
      var isOver = e.kind==='overdue'||e.kind==='port-overdue';
      return '<tr>'+
        '<td><span class="mono-tag" style="background:#E0E7FF;color:#3730A3;">'+escapeHtml(e.containerNo||e.jobNo)+'</span></td>'+
        '<td><span class="pill '+(isOver?'pill-over':'pill-soon')+'">'+(isOver?'Overdue Alert':'Due Warning')+'</span></td>'+
        '<td>'+escapeHtml(e.subject)+'</td>'+
        '<td>'+fmtDate(e.dateKey)+'</td>'+
        '<td>'+(e.sent?'<span class="pill pill-returned">Sent</span>':'<span class="pill pill-pending">Pending</span>')+'</td>'+
        '<td class="rowactions">'+(e.sent?'':'<button class="btn-pill btn-pill-secondary btn-pill-sm" data-act="mark-email-sent" data-id="'+e.id+'">Mark Sent</button>')+'</td>'+
      '</tr>';
    }).join('');

  }
  html += '</div></div>';

  return html;
}

function getPeriodRange(){
  var rs = state.reportState;
  var y = Number(rs.year);
  if(rs.periodType==='monthly'){
    var m = Number(rs.month);
    var start = y+'-'+String(m).padStart(2,'0')+'-01';
    var end = new Date(y, m, 0).toISOString().slice(0,10);
    return {start:start, end:end, label:new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})};
  }
  if(rs.periodType==='quarterly'){
    var q = Number(rs.quarter);
    var sm = (q-1)*3+1;
    var start2 = y+'-'+String(sm).padStart(2,'0')+'-01';
    var end2 = new Date(y, sm+2, 0).toISOString().slice(0,10);
    return {start:start2, end:end2, label:'Q'+q+' '+y};
  }
  return {start:y+'-01-01', end:y+'-12-31', label:'Year '+y};
}

function generateReport(){
  var range = getPeriodRange();
  var basisField = state.reportState.basis;
  var rows = state.containers.filter(function(c){
    var d = c[basisField];
    return d && d>=range.start && d<=range.end;
  });
  var summary = { total:rows.length, returned:0, overdue:0, active:0, pending:0, byLine:{} };
  rows.forEach(function(c){
    var s = effectiveStatus(c);
    if(s===STATUS.RETURNED) summary.returned++;
    else if(s===STATUS.OVER) summary.overdue++;
    else if(s===STATUS.PENDING) summary.pending++;
    else summary.active++;
    var line = c.shippingLine || 'Unspecified';
    summary.byLine[line] = (summary.byLine[line]||0)+1;
  });
  state.reportState.result = { range:range, rows:rows, summary:summary };
  render();
}

      '<div style="margin-bottom:12px;font-size:13px;">Target: <strong>'+escapeHtml(a.containerNo||'General')+'</strong> by '+escapeHtml(a.userName)+' ('+escapeHtml(a.userRole)+')</div>'+
      (lines || '<div style="color:var(--text-muted);">No field changes recorded.</div>')+
    '</div>'+
    '<div class="modal-foot"><span></span><button class="btn-pill btn-pill-secondary" data-act="close-modal">Close</button></div>'+
  '</div></div>';
}

/* ============================================================
   EVENTS
   ============================================================ */
function bootEvents(){
  var app = document.getElementById('app');

  app.addEventListener('click', function(e){
    var t = e.target.closest('[data-act]');
    if(!t) return;
    var act = t.getAttribute('data-act');
    var id = t.getAttribute('data-id');

    switch(act){
      case 'toggle-theme': toggleTheme(); break;
      case 'set-theme': setTheme(id); break;
      case 'set-bg-style': setBgStyle(id); break;
      case 'nav': state.view = id; render(); break;
      case 'login-as': loginAs(id); break;
      case 'logout': state.currentUser = null; storageSet(CURRENTUSER_KEY, null); render(); break;
      case 'open-add-container': state.modal = {type:'container', id:null, mode:'single'}; render(); break;
      case 'edit-container': state.modal = {type:'container', id:id}; render(); break;
      case 'set-add-mode': if(state.modal){ state.modal.mode = id; render(); } break;
      case 'delete-container-confirm': state.modal = {type:'confirmDelete', id:id}; render(); break;
      case 'delete-container': deleteContainer(id); break;
      case 'close-modal': state.modal = null; render(); break;
      case 'open-add-user': state.modal = {type:'user', id:null}; render(); break;
      case 'edit-user': state.modal = {type:'user', id:id}; render(); break;
      case 'audit-detail': state.modal = {type:'auditDetail', id:id}; render(); break;
      case 'sort': setSort(id); break;
      case 'clear-filters': state.filters={q:'',status:'',line:'',location:'',stage:'',overdueOnly:false}; render(); break;
      case 'gen-report': generateReport(); break;
      case 'export-containers-xlsx': exportContainersExcel(filteredContainers()); break;
      case 'export-report-xlsx': exportReportExcel(); break;
      case 'export-report-pdf': exportReportPdf(); break;
      case 'mark-email-sent': markEmailSent(id); break;
      case 'reset-demo': resetDemo(); break;
      case 'clear-data': clearData(); break;
      case 'filter-stage':
        state.filters.stage = id || '';
        state.view = 'containers';
        render();
        break;
      case 'filter-status':
        state.filters.status = id || '';
        state.view = 'containers';
        render();
        break;
      case 'filter-line':
        state.filters.line = id || '';
        state.view = 'containers';
        render();
        break;
    }
  });

  app.addEventListener('change', function(e){
    var t = e.target;
    if(t.matches('[data-filter]')){
      state.filters[t.getAttribute('data-filter')] = t.type==='checkbox'?t.checked:t.value;
      renderContentOnly();
    }
    if(t.matches('[data-report-field]')){
      state.reportState[t.getAttribute('data-report-field')] = t.value;
    }
    if(t.matches('[data-audit-filter]')){
      state.auditFilters[t.getAttribute('data-audit-filter')] = t.value;
      renderContentOnly();
    }
  });

  app.addEventListener('input', function(e){
    var t = e.target;
    if(t.matches('[data-filter="q"]')){
      state.filters.q = t.value;
      renderContentOnly();
    }
    if(t.matches('[data-audit-filter="q"]')){
      state.auditFilters.q = t.value;
      renderContentOnly();
    }
  });

  app.addEventListener('submit', function(e){
    if(e.target.matches('#containerForm')){ e.preventDefault(); submitContainerForm(e.target); }
    if(e.target.matches('#userForm')){ e.preventDefault(); submitUserForm(e.target); }
    if(e.target.matches('#loginNewForm')){ e.preventDefault(); submitNewUser(e.target); }
  });

  window.addEventListener('keydown', function(e){
    if((e.ctrlKey && e.shiftKey && (e.key === 'D' || e.key === 'd')) || (e.altKey && (e.key === 't' || e.key === 'T'))){
      e.preventDefault();
      toggleTheme();
    }
  });

  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e){
      try {
        if(!localStorage.getItem(THEME_KEY)){
          setTheme(e.matches ? 'dark' : 'light');
        }
      } catch(err){}
    });
  }
}

function loginAs(id){
  var u = state.users.filter(function(x){return x.id===id;})[0];
  if(u){
    state.currentUser = u;
    storageSet(CURRENTUSER_KEY, u.id);
    render();
  }
}

function setSort(key){
  if(state.sort.key===key){ state.sort.dir = state.sort.dir==='asc'?'desc':'asc'; }
  else { state.sort.key=key; state.sort.dir='asc'; }
  render();
}

function markEmailSent(id){
  state.emailLog = state.emailLog.map(function(e){ if(e.id===id) e.sent=true; return e; });
  storageSet(EMAILLOG_KEY, state.emailLog);
  render();
}

function resetDemo(){
  var seed = getInitialSeedData();
  state.containers = seed.containers;
  state.users = seed.users;
  state.audit = seed.audit;
  storageSet(CONTAINERS_KEY, state.containers);
  storageSet(USERS_KEY, state.users);
  storageSet(AUDIT_KEY, state.audit);
  showToast('Reset to demo data complete.');
  render();
}

function clearData(){
  state.containers = [];
  storageSet(CONTAINERS_KEY, state.containers);
  showToast('All containers cleared.');
  render();
}

function submitContainerForm(form){
  try {
    var fd = new FormData(form);
    var mode = fd.get('formMode') || 'single';

    if(mode==='bulk'){
      var jobNo = (fd.get('jobNo')||'').trim();
      var billNo = (fd.get('billNo')||'').trim();
      var pplNo = (fd.get('pplNo')||'').trim();
      var vesselName = (fd.get('vesselName')||'').trim();
      var voyageNo = (fd.get('voyageNo')||'').trim();
      var shippingLine = (fd.get('shippingLine')||'').trim();
      var productDescription = (fd.get('productDescription')||'').trim();
      var eta = fd.get('eta') || '';
      var jobRegisterDate = fd.get('jobRegisterDate') || '';
      var draftApprovalDate = fd.get('draftApprovalDate') || '';
      var fullDischargeDate = fd.get('fullDischargeDate') || '';
      var naqiaPtlDate = fd.get('naqiaPtlDate') || '';
      var whChargesPaidDate = fd.get('whChargesPaidDate') || '';
      var doIssueDate = fd.get('doIssueDate') || '';
      var gpIssueDate = fd.get('gpIssueDate') || '';
      var portFreeDays = fd.get('portFreeDays') || state.settings.portFreeDays;
      var clearanceDate = fd.get('clearanceDate') || '';
      var freeDays = fd.get('freeDays') || 14;
      var raw = fd.get('containerNumbers') || '';

      if(!jobNo){ showToast('Job No. is required.'); return; }
      var pieces = raw.split(/[\n,]+/).map(function(s){return s.trim();}).filter(Boolean);
      var seen = {}, clean = [];
      pieces.forEach(function(n){
        var key = n.toUpperCase();
        if(!seen[key]){ seen[key]=true; clean.push(n); }
      });
      if(!clean.length){ showToast('Enter at least one container number.'); return; }

      var nowIso = new Date().toISOString();
      clean.forEach(function(containerNo){
        var item = {
          id:uid('cnt'), jobNo:jobNo, billNo:billNo, containerNo:containerNo, pplNo:pplNo,
          vesselName:vesselName, voyageNo:voyageNo, shippingLine:shippingLine, productDescription:productDescription,
          eta:eta, jobRegisterDate:jobRegisterDate, draftApprovalDate:draftApprovalDate, fullDischargeDate:fullDischargeDate,
          naqiaPtlDate:naqiaPtlDate, whChargesPaidDate:whChargesPaidDate, doIssueDate:doIssueDate, gpIssueDate:gpIssueDate,
          portFreeDays:portFreeDays, clearanceDate:clearanceDate, freeDays:freeDays, emptyReturnDate:'', eirDate:'',
          statusLocked:false, status:STATUS.PENDING, location:'', createdAt:nowIso, createdBy:state.currentUser.name
        };
        item.dueDate = computeDueDate(item);
        item.status = computeStatus(item);
        state.containers.unshift(item);
      });
      storageSet(CONTAINERS_KEY, state.containers);
      pushAudit({action:'bulk-create', containerNo:'Job '+jobNo, changes:[{field:'Bulk Imported', from:'—', to:clean.length+' containers'}]});
      showToast(clean.length+' containers registered under Job '+jobNo);
      state.modal = null;
      render();
      return;
    }

    var id = fd.get('id');
    var data = {
      id: id || null,
      jobNo: fd.get('jobNo').trim(),
      billNo: fd.get('billNo').trim(),
      containerNo: fd.get('containerNo').trim(),
      pplNo: (fd.get('pplNo')||'').trim(),
      vesselName: (fd.get('vesselName')||'').trim(),
      voyageNo: (fd.get('voyageNo')||'').trim(),
      eta: fd.get('eta') || '',
      jobRegisterDate: fd.get('jobRegisterDate') || '',
      draftApprovalDate: fd.get('draftApprovalDate') || '',
      fullDischargeDate: fd.get('fullDischargeDate') || '',
      naqiaPtlDate: fd.get('naqiaPtlDate') || '',
      whChargesPaidDate: fd.get('whChargesPaidDate') || '',
      doIssueDate: fd.get('doIssueDate') || '',
      gpIssueDate: fd.get('gpIssueDate') || '',
      portFreeDays: fd.get('portFreeDays') || '',
      clearanceDate: fd.get('clearanceDate') || '',
      freeDays: fd.get('freeDays') || '',
      emptyReturnDate: fd.get('emptyReturnDate') || '',
      eirDate: fd.get('eirDate') || '',
      shippingLine: fd.get('shippingLine').trim(),
      productDescription: fd.get('productDescription').trim(),
      statusLocked: fd.get('statusLocked')==='on',
      status: fd.get('status') || '',
      location: fd.get('location') || ''
    };
    if(!data.jobNo || !data.containerNo){ showToast('Job No. and Container No. are required.'); return; }
    saveContainer(data, !id);
  } catch(e){ showToast('Could not save: '+e.message); }
}

function submitUserForm(form){
  var fd = new FormData(form);
  var id = fd.get('id');
  var data = {
    id: id || null,
    name: fd.get('name').trim(),
    email: fd.get('email').trim(),
    role: fd.get('role'),
    active: fd.get('active')==='on',
    memoji: '👨🏽‍💼'
  };
  if(!data.name){ showToast('Name is required.'); return; }
  saveUser(data, !id);
}

function submitNewUser(form){
  var fd = new FormData(form);
  var name = (fd.get('name')||'').trim();
  var email = (fd.get('email')||'').trim();
  if(!name){ showToast('Name is required.'); return; }
  var user = { id:uid('usr'), name:name, email:email, role:ROLES.STAFF, active:true, memoji:'👤' };
  state.users.push(user);
  storageSet(USERS_KEY, state.users);
  state.currentUser = user;
  storageSet(CURRENTUSER_KEY, user.id);
  showToast('Welcome, '+name+'!');
  render();
}

/* ============================================================
   INIT
   ============================================================ */
var _origRender = render;
render = function(){
  _origRender();
  wireSettings();
};

function init(){
  bootEvents();
  loadAll();

  // Real-time ticking clock for dashboard operations tracker
  setInterval(function(){
    var el = document.getElementById('liveOpsClock');
    if(el){
      var now = new Date();
      var utc = now.getTime() + (now.getTimezoneOffset() * 60000);
      var pngTime = new Date(utc + (3600000 * 10)); // PNG UTC+10
      var h = String(pngTime.getHours()).padStart(2, '0');
      var m = String(pngTime.getMinutes()).padStart(2, '0');
      var s = String(pngTime.getSeconds()).padStart(2, '0');
      el.textContent = h + ' : ' + m + ' : ' + s;
    }
  }, 1000);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

})();
</script>
